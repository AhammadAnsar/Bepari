    <script>
      (function () {
        if (typeof window === 'undefined') return;

        function ensureWritableFetch(target) {
          if (!target) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc && typeof desc.get === 'function' && typeof desc.set !== 'function') {
              if (desc.configurable) {
                var currentGetter = desc.get;
                var customFetch = null;
                Object.defineProperty(target, 'fetch', {
                  configurable: true,
                  enumerable: desc.enumerable !== false,
                  get: function () {
                    return customFetch || currentGetter.call(this);
                  },
                  set: function (fn) {
                    if (typeof fn === 'function') {
                      customFetch = fn;
                    }
                  },
                });
              }
            }
          } catch (_err) {
            // Descriptor is non-configurable; handled by error boundary below
          }
        }

        ensureWritableFetch(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          ensureWritableFetch(Window.prototype);
        }

        function isExtensionOrReadonlyFetchError(message, filename, stack) {
          var msg = String(message || '');
          var file = String(filename || '');
          var stk = String(stack || '');
          if (
            msg.indexOf('Cannot set property fetch of #<Window>') !== -1 ||
            msg.indexOf('Cannot set property fetch of') !== -1
          ) {
            return true;
          }
          if (
            file.indexOf('chrome-extension://') === 0 ||
            file.indexOf('moz-extension://') === 0 ||
            stk.indexOf('chrome-extension://') !== -1 ||
            stk.indexOf('moz-extension://') !== -1
          ) {
            return true;
          }
          return false;
        }

        window.addEventListener(
          'error',
          function (event) {
            var err = event && event.error;
            if (
              isExtensionOrReadonlyFetchError(
                event && event.message,
                event && event.filename,
                err && err.stack
              )
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function (event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && reason.stack;
            if (isExtensionOrReadonlyFetchError(msg, '', stack)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
